<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cosmo's Animal Cup</title>
<meta name="description" content="A sunny animal football memory game for young players.">
<meta name="theme-color" content="#17244a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Animal Cup">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&display=swap">
<style>
/* Layout: one-screen matchday. Navy scoreboard band → penalty-kick pitch scene → memory board filling the rest. Single sunny look by design. */
:root{
  --navy:#17244a; --navy-2:#253a72; --led:#0b1430;
  --grass:#3dae48; --grass-2:#34993f; --grass-deep:#257a30;
  --sun:#ffcc2e; --sun-deep:#d99a00;
  --pop:#ff5b47; --bluebird:#7cc8ff;
  --sky:#dcefff; --chalk:#ffffff; --ink:#17244a;
  --shade:rgba(23,36,74,.22); --veil:rgba(23,36,74,.74);
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  --ph:clamp(118px,21vh,190px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--sky);padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--sky);color:var(--ink);
  font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Scoreboard ---------- */
.scoreboard{flex:none;background:var(--navy);color:var(--chalk);display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:6px;
  padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.score{display:flex;align-items:center;gap:8px;min-width:0}
.team{font-family:var(--font-display);font-size:24px;letter-spacing:.05em;line-height:1}
.digit{font-family:var(--font-display);font-variant-numeric:tabular-nums;background:var(--led);color:var(--sun);
  min-width:38px;height:38px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font-size:26px;line-height:1;
  box-shadow:inset 0 0 0 2px var(--navy-2)}
.digit.them{color:var(--bluebird)}
.colon{font-family:var(--font-display);font-size:22px;opacity:.6}
.foe{font-family:var(--font-emoji);font-size:26px;line-height:1}
.tools{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--navy-2);border:0;display:grid;place-items:center;cursor:pointer;color:var(--chalk)}
.icon-btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.icon-btn svg{width:24px;height:24px}
.stars{grid-column:1/-1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:26px}
.slot{width:26px;height:26px;display:block}
.slot path{fill:transparent;stroke:rgba(255,255,255,.38);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s}
.slot.on path{fill:var(--sun);stroke:var(--sun-deep)}
.slot.on{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}

/* ---------- Pitch scene ---------- */
.pitch{flex:none;position:relative;height:var(--ph);overflow:hidden;
  background:linear-gradient(180deg,var(--grass) 0 24%,var(--grass) 24% 36%,var(--grass-2) 36% 50%,var(--grass) 50% 66%,var(--grass-2) 66% 84%,var(--grass) 84% 100%)}
.stand{position:absolute;inset:0 0 auto;height:24%;background:var(--navy-2);overflow:hidden}
.crowd{position:absolute;inset:-4px 0 14px 0;
  background:
    radial-gradient(circle at 5px 6px,var(--sun) 0 3.4px,transparent 3.9px) 0 0/19px 11px,
    radial-gradient(circle at 13px 6px,var(--chalk) 0 3.4px,transparent 3.9px) 0 0/19px 11px,
    radial-gradient(circle at 6px 5px,var(--pop) 0 3.4px,transparent 3.9px) 9px 5px/23px 11px,
    radial-gradient(circle at 15px 5px,var(--bluebird) 0 3.4px,transparent 3.9px) 3px 5px/29px 11px}
.crowd.roar{animation:roar .16s ease-in-out 8 alternate}
@keyframes roar{to{transform:translateY(-4px)}}
.hoarding{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--pop);overflow:hidden}
.ticker{display:flex;width:max-content;animation:ticker 28s linear infinite}
.ticker span{font-family:var(--font-display);font-size:10px;line-height:14px;letter-spacing:.14em;color:var(--chalk);white-space:nowrap;padding-right:1.6em}
@keyframes ticker{to{transform:translateX(-50%)}}
.box{position:absolute;left:50%;top:68%;height:16%;width:min(76%,400px);transform:translateX(-50%);border:3px solid rgba(255,255,255,.75);border-top:0}
.goalline{position:absolute;left:0;right:0;top:calc(68% - 1px);height:3px;background:rgba(255,255,255,.85)}
.spot{position:absolute;left:50%;bottom:16%;width:8px;height:5px;margin-left:-4px;border-radius:50%;background:var(--chalk)}
.goal{position:absolute;left:50%;top:20%;height:48%;width:min(50%,250px);transform:translateX(-50%)}
.net{position:absolute;inset:0;border:5px solid var(--chalk);border-bottom:0;border-radius:5px 5px 0 0;transform-origin:50% 100%;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 1.5px,transparent 1.5px 9px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 1.5px,transparent 1.5px 9px),
    rgba(23,36,74,.28);
  box-shadow:0 3px 0 rgba(23,36,74,.25)}
.sprite{position:absolute;font-family:var(--font-emoji);line-height:1;text-align:center;width:1.2em;margin-left:-.6em}
.keeper{left:50%;bottom:31%;font-size:calc(var(--ph)*.25);transform-origin:50% 100%}
.keeper-body{display:inline-block;animation:sway 1.7s ease-in-out infinite alternate}
.keeper.diving .keeper-body{animation-play-state:paused}
@keyframes sway{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.kicker{left:calc(50% - var(--ph)*.42);bottom:3%;font-size:calc(var(--ph)*.3);visibility:hidden;transform-origin:50% 100%}
.kicker-body{display:inline-block}
.kicker-body.run{animation:hop .18s ease-in-out infinite}
.kicker-body.party{animation:hop .34s ease-in-out 5}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
.ball{left:50%;bottom:8%;font-size:calc(var(--ph)*.19)}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:8px;max-width:104px;padding:4px 10px;border-radius:12px;
  background:rgba(23,36,74,.78);color:var(--chalk);font-weight:800;font-size:12px;line-height:1.15}
.goal-text{position:absolute;inset:0 0 auto;height:72%;display:flex;align-items:center;justify-content:center;gap:.02em;pointer-events:none;
  font-family:var(--font-display);font-size:calc(var(--ph)*.42);color:var(--sun);letter-spacing:.03em;
  -webkit-text-stroke:calc(var(--ph)*.022) var(--navy);paint-order:stroke fill;text-shadow:0 .06em 0 var(--navy);
  opacity:0;transition:opacity .3s}
.goal-text span{display:inline-block}
.goal-text.show{opacity:1}
.goal-text.show span{animation:letter .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes letter{0%{transform:translateY(70%) scale(.2) rotate(-12deg)}100%{transform:none}}

/* ---------- Board ---------- */
.board{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;gap:var(--gap,10px);--tile:96px}
.card{position:relative;width:var(--tile);height:var(--tile);border:0;padding:0;background:none;cursor:pointer;
  perspective:700px;border-radius:20%;animation:deal .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*35ms)}
@keyframes deal{from{transform:scale(.5) rotate(-8deg)}}
.card:focus-visible{outline:4px solid var(--pop);outline-offset:4px}
.inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 var(--shade)}
.back{background:
    radial-gradient(circle at 50% 50%,var(--chalk) 0 4%,transparent 4.5%),
    radial-gradient(circle at 50% 50%,transparent 0 16%,var(--chalk) 16.5% 20%,transparent 20.5%),
    linear-gradient(var(--chalk),var(--chalk)) center/3px 100% no-repeat,
    repeating-linear-gradient(90deg,var(--grass) 0 12.5%,var(--grass-2) 12.5% 25%);
  box-shadow:inset 0 0 0 4px var(--chalk),0 5px 0 var(--grass-deep)}
@media (hover:hover){.card:not(.up):hover .back{filter:brightness(1.08)}}
.front{transform:rotateY(180deg);background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;
  box-shadow:inset 0 0 0 4px var(--chalk),0 5px 0 var(--shade)}
.emoji{font-family:var(--font-emoji);font-size:calc(var(--tile)*.5);line-height:1}
.name{font-weight:800;font-size:calc(var(--tile)*.14);line-height:1;color:var(--ink)}
.grid.tiny .name{display:none}
.num{font-family:var(--font-display);font-size:calc(var(--tile)*.44);line-height:.95;color:var(--navy)}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--tile)*.022);width:64%;padding:calc(var(--tile)*.03);border-radius:calc(var(--tile)*.05);background:rgba(23,36,74,.13)}
.frame i{display:block;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.75)}
.frame i.on{background:var(--pop)}
.grid.tiny .num{font-size:calc(var(--tile)*.42)}
.jersey{display:block;width:1em;height:1.2em;overflow:visible}
.grid.tiny .emoji{font-size:calc(var(--tile)*.6)}
.card.got .front{box-shadow:inset 0 0 0 5px var(--sun),0 5px 0 var(--sun-deep)}
.badge{position:absolute;top:-9%;right:-9%;width:38%;height:38%;z-index:2;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.badge path{fill:var(--sun);stroke:var(--navy);stroke-width:1.6;stroke-linejoin:round}
.card.got .badge{transform:scale(1) rotate(-12deg);transition-delay:.15s}

/* ---------- Flying star, confetti, overlay ---------- */
.flystar{position:fixed;width:44px;height:44px;z-index:25;pointer-events:none}
.flystar path{fill:var(--sun);stroke:var(--navy);stroke-width:1.4;stroke-linejoin:round}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--veil);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(100%,380px);max-height:100%;overflow:auto;background:var(--chalk);border-radius:28px;padding:22px 20px 20px;text-align:center;
  box-shadow:0 10px 0 var(--grass-deep);display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(30px) scale(.9)}}
.trophy{font-family:var(--font-emoji);font-size:76px;line-height:1;animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(4deg)}}
.panel h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;color:var(--navy);text-wrap:balance}
.panel p{margin:0;font-weight:600;font-size:16px;color:var(--navy-2)}
.panel .stars{gap:4px}
.panel .slot{width:30px;height:30px}
.label{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-2);margin-top:4px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pick{border:0;border-radius:16px;background:var(--sky);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 0 0 2px transparent}
.pick b{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.1;color:var(--navy)}
.pick span{font-weight:800;font-size:12px;color:var(--navy-2)}
.pick[aria-pressed="true"]{background:var(--sun);box-shadow:inset 0 0 0 2px var(--sun-deep)}
.pick:focus-visible,.play:focus-visible,.textbtn:focus-visible{outline:3px solid var(--pop);outline-offset:3px}
.play{width:100%;height:64px;border:0;border-radius:20px;background:var(--pop);color:var(--chalk);font-family:var(--font-display);font-size:28px;letter-spacing:.04em;cursor:pointer;box-shadow:0 6px 0 #c23c2c;margin-top:4px}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #c23c2c}
.textbtn{border:0;background:none;font-weight:800;font-size:15px;color:var(--navy-2);padding:6px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Level bar ---------- */
body::after{content:"";position:fixed;inset:auto 0 0;height:env(safe-area-inset-bottom,0px);z-index:10;background:var(--navy)}
.levels{flex:none;background:var(--navy);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.levels-inner{display:flex;align-items:center;justify-content:center;gap:12px;max-width:520px;margin:0 auto}
.levels-label{font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.seg{flex:1;max-width:400px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--led)}
.lvl{height:42px;border:0;border-radius:10px;background:transparent;color:var(--chalk);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:15px;line-height:1}
.lvl:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.lvl[aria-pressed="true"]{background:var(--sun);color:var(--navy)}
.pips{display:inline-flex;gap:3px}
.pips i{display:block;width:6px;height:6px;border-radius:50%;background:currentColor}
.deckseg{flex:none;grid-template-columns:repeat(2,46px);max-width:none}
.deckseg .lvl{padding:0}
.deck-icon{font-family:var(--font-emoji);font-size:22px;line-height:1}
.deck-num{font-family:var(--font-display);font-weight:400;font-size:17px;letter-spacing:.02em}
.picker.two{grid-template-columns:repeat(2,1fr)}
.pick .pick-icon{font-family:var(--font-emoji);font-size:26px;line-height:1.1}
.pick .pick-num{font-family:var(--font-display);font-size:24px;line-height:1.1;color:var(--navy)}
@media (max-width:420px){
  .levels-label{display:none}
  .levels-inner{gap:8px}
  #seg .lvl{flex-direction:column;gap:4px;font-size:14px}
}
@media (max-width:350px){#seg .lvl{font-size:12px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<header class="scoreboard">
  <div class="score" aria-label="Score">
    <span class="team">COSMO</span>
    <span class="digit" id="digit">0</span>
    <span class="colon">:</span>
    <span class="digit them">0</span>
    <span class="foe" aria-hidden="true">🐻</span>
  </div>
  <div class="tools">
    <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound on" aria-pressed="false"></button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="New game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
  <div class="stars" id="stars" aria-label="Stars"></div>
</header>

<section class="pitch" id="pitch" aria-hidden="true">
  <div class="stand">
    <div class="crowd" id="crowd"></div>
    <div class="hoarding"><div class="ticker"><span>COSMO'S ANIMAL CUP • GO COSMO GO • COSMO'S ANIMAL CUP • GO COSMO GO •</span><span>COSMO'S ANIMAL CUP • GO COSMO GO • COSMO'S ANIMAL CUP • GO COSMO GO •</span></div></div>
  </div>
  <div class="box"></div>
  <div class="goalline"></div>
  <div class="spot"></div>
  <div class="goal" id="goal"><div class="net" id="net"></div></div>
  <div class="sprite keeper" id="keeper"><span class="keeper-body">🐻</span></div>
  <div class="sprite kicker" id="kicker"><span class="kicker-body" id="kickerBody">🦁</span></div>
  <div class="sprite ball" id="ball">⚽</div>
  <div class="hint" id="hint">Find a pair to shoot!</div>
  <div class="goal-text" id="goalText"><span style="--i:0">G</span><span style="--i:1">O</span><span style="--i:2">A</span><span style="--i:3">L</span><span style="--i:4">!</span></div>
</section>

<main class="board" id="board">
  <div class="grid" id="grid" role="group" aria-label="Memory cards"></div>
</main>

<nav class="levels" aria-label="Level">
  <div class="levels-inner">
    <div class="seg deckseg" id="deckSeg" role="group" aria-label="Cards"></div>
    <span class="levels-label">Level</span>
    <div class="seg" id="seg" role="group" aria-label="Level"></div>
  </div>
</nav>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<canvas id="confetti"></canvas>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(() => {
  const ANIMALS = [
    ["🦁","Lion"],["🐘","Elephant"],["🐵","Monkey"],["🐸","Frog"],["🐼","Panda"],["🦒","Giraffe"],
    ["🐯","Tiger"],["🐶","Puppy"],["🐱","Kitty"],["🐷","Pig"],["🐮","Cow"],["🦊","Fox"],
    ["🐰","Bunny"],["🐨","Koala"],["🐙","Octopus"],["🦓","Zebra"],["🐢","Turtle"],["🦆","Duck"],
    ["🐬","Dolphin"],["🦖","Dinosaur"],["🐧","Penguin"],["🦉","Owl"],["🐴","Horse"],["🐝","Bee"]
  ];
  const TINTS = ["#ffe38f","#ffc6b8","#cdf2bd","#c2e5ff","#e6d0ff","#ffd3ea","#c9f3ec","#ffe2c4"];
  const WORDS = ["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
  const numberFace = (n) => `<span class="num">${n}</span><span class="frame" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i${i < n ? ' class="on"' : ""}></i>`).join("")}</span>`;
  const jersey = (n) => `<svg class="jersey" viewBox="0 0 40 48" aria-hidden="true">
      <path d="M13 4 7 6.5 1.5 13l6 5.5 3-3V36h19V15.5l3 3 6-5.5L33 6.5 27 4c-1.6 3-4 4.4-7 4.4S14.6 7 13 4z" fill="var(--pop)" stroke="var(--navy)" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="10.5" y="35" width="19" height="6" rx="1.5" fill="var(--navy)"/>
      <path d="M15 41v5M25 41v5" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"/>
      <text x="20" y="29" text-anchor="middle" font-size="${n > 9 ? 13 : 16}" fill="var(--chalk)" style="font-family:var(--font-display)">${n}</text>
    </svg>`;
  const DECKS = {
    animals: ANIMALS.map(([e, n], i) => ({ name: n, call: n, face: `<span class="emoji">${e}</span><span class="name">${n}</span>`, kicker: e, tint: TINTS[i % TINTS.length] })),
    numbers: WORDS.map((w, i) => ({ name: String(i + 1), call: "Number " + w, face: numberFace(i + 1), kicker: jersey(i + 1), tint: TINTS[i % TINTS.length] }))
  };
  const DECK_INFO = { animals: { word: "Animals", icon: '<span class="deck-icon">🦁</span>', big: '<span class="pick-icon">🦁</span>' },

    panel.querySelectorAll("#deckPick .pick").forEach(b => b.addEventListener("click", () => {
      pickedDeck = b.dataset.d; sfx.flip();
      panel.querySelectorAll("#deckPick .pick").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.d === pickedDeck)));
    }));
    $("playBtn").addEventListener("click", () => {
      try { localStorage.setItem("cosmo-pairs", String(picked)); localStorage.setItem("cosmo-deck", pickedDeck); } catch (e) {}
      sfx.match(); hideOverlay(); newGame(picked, null, pickedDeck);
    });
    overlay.hidden = false;
    setTimeout(() => { const b = $("playBtn"); b && b.focus({ preventScroll: true }); }, 50);
  }
  function hideOverlay() { overlay.hidden = true; }
  $("menuBtn").addEventListener("click", () => showOverlay("menu"));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden && cards.some(c => !c.got)) hideOverlay(); });

  addEventListener("resize", () => { layout(); sizeCanvas(); });

  /* ---------- Boot ---------- */
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ pairs, deckType, deck: cards.map(c => [c.a, c.got ? 1 : 0]) }));
  const start = (data) => {
    renderMute(); sizeCanvas();
    const d = data || {};
    const dt = DECKS[d.deckType] ? d.deckType : "animals";
    const resumable = d.deck && SIZES.some(s => s.p === d.pairs) && d.deck.some(x => !x[1]) && d.deck.every(x => x[0] < DECKS[dt].length);
    newGame(resumable ? d.pairs : pairs, resumable ? d : null, resumable ? dt : deckType);
  };
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
